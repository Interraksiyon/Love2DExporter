name: Windows checks and app build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exports, reports, and hidden GUI layout
        run: python -m unittest discover -s tests -v
      - name: Build app and release ZIP
        if: github.event_name != 'pull_request'
        run: python scripts/build_app.py
      - name: Upload distributable artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LoveExporter-Windows-x64
          path: |
            dist/LoveExporter-*-Windows-x64.zip
            dist/*.sha256
          if-no-files-found: error
